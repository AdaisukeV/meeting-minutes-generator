# プロジェクト固有設定(docs/design/05-project-assets.md §1)。
# generate_minutes.sh はこのファイルをパースせず、内容をそのまま各ステップの
# プロンプトへコンテキストとして渡す(stdin の PROJECT_CONFIG セクション)。
#
# 使い方:
#   cp -r projects/_template projects/<プロジェクト名>
#   その後、この記入例を実際の会社名・話者名に置き換える。
#
# 注意:Git 管理対象はこの雛形(_template)と動作確認用の sample のみで、
# コピーして作った projects/<プロジェクト名>/ は .gitignore で除外される。
# そのため実在の顧客名・個人名を書いてよいが、別環境へ持ち運ぶ際は
# リポジトリ経由では同期されない(会議内容そのものは inputs/ 配下に置く)。

# プロジェクト表示名(必須)
project: サンプル案件

# 会社名・略称・立場(必須)。文字起こしの表記ゆれを寄せる基準になる。
companies:
  - name: 株式会社サンプル
    short_name: サンプル社
    role: 顧客
  - name: 自社株式会社
    short_name: 自社
    role: 自社

# 話者(必須)。aliases は文字起こしに現れうる呼称・姓のみ・カタカナ表記などを列挙する。
speakers:
  - name: 山田 太郎
    role: 部長
    company: 株式会社サンプル
    aliases: ["山田", "山田さん", "ヤマダ"]
  - name: 鈴木 花子
    role: PM
    company: 自社株式会社
    aliases: ["鈴木", "鈴木さん"]

# トピック分類の粒度・観点(任意・ステップ2で使用)
topic_guidelines: |
  アジェンダ単位でトピックを分ける。技術的検討と契約・スケジュールの話題は分離する。

# 議事録の見出し構成(必須)。ステップ3はこの順に `##` 見出しを立てる。
#
# 注意:「詳細な議事録」「発言録」のように**全発言を再掲するセクションを足さない**。
# ステップ3の出力が数倍(実測で全体の69%)に膨らみ、1回の呼び出しの出力トークン上限に
# 当たる。上限に当たると claude が応答を自動継続し、生成に成功しても先頭が失われる
# (現在はスクリプトが検知して失敗させる。docs/design/09-decisions.md 6.5)。
# 議論の経過は `02_structured_conversation.md` を参照する運用が既定である。
minutes_sections:
  - 会議概要
  - 決定事項
  - 検討事項(要件・目標値・見積)
  - ToDo(担当者・期限)
  - 懸念事項
  - 次回アクション

# 文体(任意・ステップ3で使用)
style:
  tone: 敬体(です・ます)
  person: 三人称
  tense: 過去形

# 補足(任意)。専門用語・略語の対応など、LLM が誤読しやすい語を書く。
notes: |
  略語:SS=サブシステム、UT=単体テスト
